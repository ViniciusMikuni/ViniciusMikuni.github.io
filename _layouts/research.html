<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% unless page.url == '/' %}{{ page.title | escape }} · {% endunless %}Vinicius Mikuni</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | escape }} · Vinicius Mikuni">
  <meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | escape }}">
  <meta property="og:image" content="{{ '/images/vinicius-mikuni.png' | absolute_url }}">
  <meta name="theme-color" content="#f7f6f2">
  <link rel="stylesheet" href="{{ '/assets/css/research.css' | relative_url }}">
  <script src="{{ '/assets/js/research.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header wrap">
    <a class="wordmark" href="{{ '/' | relative_url }}">Vinicius Mikuni<span class="wordmark-dot" aria-hidden="true">.</span></a>
    <nav aria-label="Main navigation">
      <a href="{{ '/#research' | relative_url }}">Research</a>
      <a href="{{ '/publications/' | relative_url }}" {% if page.url == '/publications/' %}aria-current="page"{% endif %}>Publications</a>
      <a href="{{ '/members/' | relative_url }}" {% if page.url == '/members/' %}aria-current="page"{% endif %}>Members</a>
      <a href="{{ '/talks/' | relative_url }}" {% if page.url == '/talks/' %}aria-current="page"{% endif %}>Talks</a>
      <a href="{{ '/cv/' | relative_url }}" {% if page.url == '/cv/' %}aria-current="page"{% endif %}>CV</a>
    </nav>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="site-footer wrap">
    <div><strong>Vinicius Mikuni</strong><br>AI for the physical sciences · Nagoya University</div>
    <div class="footer-links"><a href="mailto:vinicius.mikuni@gmail.com">Email</a><a href="https://github.com/ViniciusMikuni">GitHub</a><a href="https://inspirehep.net/authors/1622350">INSPIRE</a><a href="https://orcid.org/0000-0002-1579-2421">ORCID</a></div>
    <small>© {{ 'now' | date: '%Y' }} Vinicius Mikuni</small>
  </footer>
</body>
</html>
